<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
    <title>Login</title>
</head>
<body>

    {% with mensagens = get_flashed_messages(with_categories=true) %}
        {% if mensagens %}
        <div class="mensagens">
        {% for categoria, texto in mensagens %}
            <div class="alerta alerta-{{ categoria }}" role="alert">{{ texto }}</div>
        {% endfor %}
            </div>
        {% endif %}
    {% endwith %}

    <section class="login">

        <header class="logo">
            <img src="{{ url_for('static', filename='img/logo_credora.png') }}" alt="Logo credora">
        </header>

        <h1>Entre na sua conta</h1>
        <p>Insira suas credenciais</p>

        <form action="{{ url_for('login') }}" method="POST">
            <label>Email:</label>
            <input type="text" name="email" placeholder="Digite seu email" required>

            <label>Senha</label>
            <input type="password" id="campo_senha" name="senha" placeholder="Digite sua senha" required>

            <div style="margin-top: 5px; margin-bottom: 20px; text-align: left; width: 100%; display: flex; align-items: center; gap: 8px;">
                <input type="checkbox" id="ver_senha" style="width: auto; display: inline-block; cursor: pointer;" onchange="document.getElementById('campo_senha').type = this.checked ? 'text' : 'password'">
                <label for="ver_senha" style="font-size: 12px; color: #b0c4de; font-weight: normal; cursor: pointer; margin: 0;">Mostrar senha</label>
            </div>

            <button class="botao-entrar" type="submit">ENTRAR</button>
        </form>

        <a class="cor" href="cadastro">Sem conta? Crie uma!</a>

    </section>
</body>
</html>
